name: UT Bot Daily Scan
'on':
  schedule:
    # Her gün 08:00 UTC = 11:00 TSİ (Türkiye tüm yıl UTC+3)
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: state/
          key: ut-bot-daily-alert-state-${{ github.run_id }}
          restore-keys: |
            ut-bot-daily-alert-state-

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_STATE_FILE: state/alerts.json
        run: python stoch_rsi_bot.py --once

      - name: Save alert state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state/
          key: ut-bot-daily-alert-state-${{ github.run_id }}
