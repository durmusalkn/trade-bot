name: UT Bot Hourly Scan
'on':
  schedule:
    # Her saat başından 5 dk sonra: mumun kapanıp veriye yansıması için pay.
    # Sadece ABD seansı (14:30-21:00 UTC) taransın istersen: "5 14-21 * * 1-5"
    # (BTC 7/24 olduğu için tam saatlik tarama önerilir.)
    - cron: "5 * * * *"
  workflow_dispatch:

# Uzun süren bir tarama bir sonraki saatin çalışmasıyla çakışmasın
concurrency:
  group: ut-bot-hourly
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: state/
          key: ut-bot-1h-alert-state-${{ github.run_id }}
          restore-keys: |
            ut-bot-1h-alert-state-

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_STATE_FILE: state/alerts.json
        run: python stoch_rsi_bot.py --once

      - name: Save alert state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state/
          key: ut-bot-1h-alert-state-${{ github.run_id }}
