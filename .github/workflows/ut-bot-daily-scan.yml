name: UT Bot Daily Scan
'on':
  schedule:
    # 02:05 UTC = 05:05 TSİ. Salı–Cumartesi: Pazartesi–Cuma seansları + Cuma after-hours.
    # After-hours yazın 03:00 TSİ'de biter; 05:00 veri ve karar için pay bırakır.
    - cron: "5 2 * * 2-6"
  workflow_dispatch:

concurrency:
  group: ut-bot-daily
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: state/alerts-1d.json
          key: ut-bot-1d-alert-state-${{ github.run_id }}
          restore-keys: |
            ut-bot-1d-alert-state-

      - name: Run daily scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_STATE_FILE: state/alerts-1d.json
        run: python daily_ut_bot.py --once

      - name: Save alert state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state/alerts-1d.json
          key: ut-bot-1d-alert-state-${{ github.run_id }}
