name: Swing Backtest
'on':
  push:
    branches:
      - claude/eloquent-ride-s95k92
    paths:
      - "backtest/**.py"
      - ".github/workflows/swing-backtest.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: swing-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pyarrow

      - name: Cache date
        id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Fiyat ve bilanço verisi günde bir kez indirilir
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: backtest/cache
          key: swing-backtest-data-v2-${{ steps.date.outputs.today }}

      - name: Run backtest
        run: |
          # M3 sağlamlık testi: geniş Nasdaq evreni, toplam $3 komisyon (alım $1.5 + satım $1.5)
          rm -rf backtest/results_m3_robustness
          python -m backtest.run_m3_robustness --capital 500 --commission 1.5 --mc-runs 50

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -f backtest/results_m3_robustness
          git diff --cached --quiet && exit 0
          git commit -m "Update swing backtest results"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
